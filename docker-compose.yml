services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hvm
      POSTGRES_USER: hvm
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["hvm_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  hvm_pg:
